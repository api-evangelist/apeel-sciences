aid: apeel-sciences
name: Apeel
description: 'Apeel (Apeel Sciences) is a food technology company founded in 2012 and headquartered in
  Goleta, California. It produces a plant-derived, edible coating, made from lipids and glycerolipids
  found in the peels, seeds and pulp of produce, that is applied to fresh fruit and vegetables at packing
  houses to slow water loss and oxidation, extending shelf life and reducing food waste across the supply
  chain. Apeel-treated produce is sold through grocery retailers in multiple countries. In 2021 Apeel
  acquired ImpactVision and added hyperspectral imaging to its supplier installations to grade interior
  quality, ripeness and freshness. Apeel is a materials-science and supply-chain operator: as of this
  profile it publishes no public developer portal, API documentation, machine-readable API contract, or
  self-serve developer sign-up.'
